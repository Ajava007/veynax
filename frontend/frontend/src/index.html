<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>VeynaX AMMS — Factory Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="VeynaX Automotive Manufacturing Management System">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { background: #070b14; margin: 0; }
    .vx-boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #070b14; z-index: 9999;
      font-family: 'Inter', system-ui, sans-serif; color: #94a3b8; font-size: .85rem;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .vx-boot::after {
      content: ''; width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(99,102,241,0.2); border-top-color: #6366f1;
      position: absolute; margin-top: -60px; animation: vx-spin .8s linear infinite;
    }
    @keyframes vx-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <vx-root>
    <div class="vx-boot">Loading VeynaX</div>
  </vx-root>
</body>
</html>
