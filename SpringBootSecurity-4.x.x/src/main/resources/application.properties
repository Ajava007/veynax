spring.application.name=SpringBootSecqurityEx


# Load optional, ignored local development settings from the project-root .env file.
spring.config.import=optional:file:.env[.properties]


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200}


# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# SERVER
# =========================================================
server.port=8080


# =========================================================
# BOOTSTRAP USERS - FACTORY MANAGEMENT SYSTEM
# =========================================================

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}

# Common password for all users
app.bootstrap.common-password=${BOOTSTRAP_COMMON_PASSWORD:Factory@123}

# ==============================
# SUPER ADMIN
# ==============================
app.bootstrap-super-admin.username=super
app.bootstrap-super-admin.email=super@gmail.com
app.bootstrap-super-admin.password=${BOOTSTRAP_COMMON_PASSWORD:Factory@123}

# ==============================
# FACTORY ADMIN
# ==============================
app.bootstrap-factory-admin.username=fadmin
app.bootstrap-factory-admin.email=fadmin@gmail.com
app.bootstrap-factory-admin.password=${BOOTSTRAP_COMMON_PASSWORD:Factory@123}

# ==============================
# MANAGER
# ==============================
app.bootstrap-manager.username=mgr
app.bootstrap-manager.email=mgr@gmail.com
app.bootstrap-manager.password=${BOOTSTRAP_COMMON_PASSWORD:Factory@123}

# ==============================
# SUPERVISOR
# ==============================
app.bootstrap-supervisor.username=sup
app.bootstrap-supervisor.email=sup@gmail.com
app.bootstrap-supervisor.password=${BOOTSTRAP_COMMON_PASSWORD:Factory@123}

# ==============================
# OPERATOR
# ==============================
app.bootstrap-operator.username=op
app.bootstrap-operator.email=op@gmail.com
app.bootstrap-operator.password=${BOOTSTRAP_COMMON_PASSWORD:Factory@123}

# ==============================
# QUALITY INSPECTOR
# ==============================
